name: Aggiorna i contenuti del Carnevale

# Rilegge notizie ed eventi dal sito ufficiale del Carnevale di Viareggio e
# aggiorna il documento pubblicato su GitHub Pages, da cui l'app si rifornisce.
#
# Lo strumento vive nel repository dell'app (dpcons/Carnevale.VG, pubblico):
# qui viene scaricato e compilato al volo, cosi' il commit resta in questo
# repository e basta il GITHUB_TOKEN, senza credenziali aggiuntive.

on:
  schedule:
    # Ogni giorno alle 05:20 UTC, cioe' le 6:20 o 7:20 a Viareggio.
    # Nota: GitHub sospende le esecuzioni pianificate dopo 60 giorni di
    # inattivita' del repository; in quel caso vanno riattivate a mano.
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      solo_prova:
        description: Esegue senza scrivere nulla
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: aggiorna-contenuti
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOCUMENTO: carnevale-viareggio/contenuti-v1.json

jobs:
  aggiorna:
    name: Aggiorna notizie ed eventi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dei contenuti pubblicati
        uses: actions/checkout@v7

      - name: Checkout dello strumento
        uses: actions/checkout@v7
        with:
          repository: dpcons/Carnevale.VG
          path: strumento

      - name: Installa .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: strumento/global.json

      - name: Aggiorna il documento
        run: >-
          dotnet run
          --project strumento/tools/CarnevaleVG.Aggiornatore
          --configuration Release
          --
          --percorso "$DOCUMENTO"
          --prolisso
          ${{ inputs.solo_prova && '--solo-prova' || '' }}

      - name: Verifica se ci sono novita'
        id: differenze
        run: |
          if git diff --quiet -- "$DOCUMENTO"; then
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
            echo "Nessuna novita' da pubblicare."
          else
            echo "cambiato=si" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- "$DOCUMENTO"
          fi

      - name: Pubblica le novita'
        if: steps.differenze.outputs.cambiato == 'si'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DOCUMENTO"
          git commit -m 'Carnevale di Viareggio: aggiorna notizie ed eventi'
          git push

      # Un push fatto con il GITHUB_TOKEN non fa ripartire da solo la
      # pubblicazione delle Pages: va chiesta esplicitamente.
      - name: Richiedi la ricostruzione delle Pages
        if: steps.differenze.outputs.cambiato == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
